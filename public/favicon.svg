<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gymPulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="gymDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181F2C" />
      <stop offset="100%" stop-color="#0A0D12" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#gymDarkGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#10B981" stroke-width="8" stroke-opacity="0.3" />
  <!-- Dumbbell Icon Elements -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)" fill="url(#gymPulseGrad)">
    <!-- Center Bar -->
    <rect x="156" y="240" width="200" height="32" rx="16" />
    <!-- Left Inner Weight -->
    <rect x="124" y="186" width="32" height="140" rx="12" />
    <!-- Left Outer Weight -->
    <rect x="80" y="206" width="32" height="100" rx="10" />
    <!-- Right Inner Weight -->
    <rect x="356" y="186" width="32" height="140" rx="12" />
    <!-- Right Outer Weight -->
    <rect x="400" y="206" width="32" height="100" rx="10" />
  </g>
  <!-- Accent Pulse Dot -->
  <circle cx="410" cy="102" r="24" fill="#10B981" />
</svg>

